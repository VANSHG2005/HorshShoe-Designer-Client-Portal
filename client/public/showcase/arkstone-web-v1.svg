<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="arkstone_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#arkstone_bg)" rx="20" />
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#1e293b" stroke-width="1.5" rx="16" />

  <!-- Architectural Grid Lines -->
  <line x1="80" y1="25" x2="80" y2="475" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="720" y1="25" x2="720" y2="475" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="25" y1="120" x2="775" y2="120" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />

  <g transform="translate(400, 180)">
    <rect x="-40" y="-40" width="80" height="80" fill="#eab308" rx="12" />
    <path d="M-20,20 L0,-20 L20,20 Z" fill="#000000" />
  </g>

  <text x="400" y="280" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">ARKSTONE INFRA</text>
  <text x="400" y="315" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#eab308" letter-spacing="5" text-anchor="middle">ARCHITECTURAL BRAND &amp; RESPONSIVE WEB</text>
  <text x="400" y="350" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">Trustworthy, Premium, and Future-Ready Digital Experience</text>
  <text x="400" y="420" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" text-anchor="middle">THE HORSE SHOE STUDIO &bull; APPROVED DIGITAL SYSTEM</text>
</svg>
