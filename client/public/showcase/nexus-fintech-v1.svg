<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" fill="none">
  <defs>
    <linearGradient id="bgWire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="640" fill="url(#bgWire)" />

  <!-- Grid Blueprint lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="640" />
    <line x1="250" y1="0" x2="250" y2="640" />
    <line x1="450" y1="0" x2="450" y2="640" />
    <line x1="700" y1="0" x2="700" y2="640" />
    <line x1="850" y1="0" x2="850" y2="640" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="280" x2="1000" y2="280" />
    <line x1="0" y1="440" x2="1000" y2="440" />
  </g>

  <!-- Spec Strip -->
  <text x="70" y="70" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="2">PROJECT: HSS-101 // WIREFRAME EXPLORATION (v1)</text>
  <text x="930" y="70" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#64748b" text-anchor="end">STATUS: CHANGES REQUESTED &bull; LOW-FI DRAFT</text>
  <line x1="70" y1="85" x2="930" y2="85" stroke="#334155" stroke-width="1" />

  <!-- Left Wireframe Frame -->
  <g transform="translate(140, 110)">
    <rect width="300" height="460" rx="36" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <rect x="100" y="12" width="100" height="18" rx="9" fill="#0f172a" />

    <!-- Balance Wire Card -->
    <rect x="25" y="60" width="250" height="120" rx="14" fill="#0f172a" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 2" />
    <text x="45" y="95" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8">Balance Module Wireframe</text>
    <text x="45" y="130" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#cbd5e1">$00,000.00</text>
    <line x1="45" y1="150" x2="220" y2="150" stroke="#334155" stroke-width="2" />

    <!-- Action Buttons -->
    <g transform="translate(25, 205)">
      <circle cx="25" cy="20" r="16" fill="#334155" />
      <circle cx="85" cy="20" r="16" fill="#334155" />
      <circle cx="145" cy="20" r="16" fill="#334155" />
      <circle cx="205" cy="20" r="16" fill="#334155" />
    </g>

    <!-- Tx Lines -->
    <rect x="25" y="275" width="250" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="25" y="325" width="250" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="25" y="375" width="250" height="40" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  </g>

  <!-- Right Review Comments -->
  <g transform="translate(520, 140)">
    <rect width="360" height="150" rx="14" fill="#1e293b" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.6" />
    <text x="24" y="35" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#f87171">Reviewer Note &bull; Jordan Blake (Nexus)</text>
    <text x="24" y="65" font-family="Inter, sans-serif" font-size="11" fill="#e2e8f0">"Can we enhance the contrast on the card balance numbers? Also, our product team requested a FaceID biometric indicator in v2."</text>
    <rect x="24" y="105" width="120" height="26" rx="6" fill="#991b1b" />
    <text x="84" y="122" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10" font-weight="700" fill="#fecaca" text-anchor="middle">STATUS: REVISION</text>
  </g>

  <text x="500" y="615" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">THE HORSE SHOE STUDIO &bull; ITERATION v1 BLUEPRINT</text>
</svg>