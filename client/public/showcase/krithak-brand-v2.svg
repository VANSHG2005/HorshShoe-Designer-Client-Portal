<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="krithak_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="gold_foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#krithak_bg)" rx="20" />
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="#27272a" stroke-width="1.5" rx="14" />
  <rect x="40" y="40" width="720" height="420" fill="none" stroke="url(#gold_foil)" stroke-width="1" stroke-dasharray="6 4" opacity="0.4" rx="10" />
  
  <!-- Royal Emblem Insignia: Feather & Horseshoe -->
  <g transform="translate(400, 200)">
    <circle cx="0" cy="0" r="60" fill="#1c1917" stroke="url(#gold_foil)" stroke-width="2" />
    <path d="M-22,-20 C-22,-32, -12,-38, 0,-38 C12,-38, 22,-32, 22,-20 C22,-8, 16,18, 0,28 C-16,18, -22,-8, -22,-20 Z" fill="none" stroke="url(#gold_foil)" stroke-width="2.5" />
    <circle cx="-10" cy="-12" r="2" fill="url(#gold_foil)" />
    <circle cx="0" cy="-18" r="2" fill="url(#gold_foil)" />
    <circle cx="10" cy="-12" r="2" fill="url(#gold_foil)" />
  </g>

  <text x="400" y="310" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="4" text-anchor="middle">KRITHAK</text>
  <text x="400" y="340" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#d97706" letter-spacing="6" text-anchor="middle">LUXURY TROUSSEAU WEAR</text>
  <text x="400" y="375" font-family="'Caveat', cursive" font-size="20" fill="#a1a1aa" text-anchor="middle">"A language of grace, strength, and intentional power"</text>
  <text x="400" y="420" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a" text-anchor="middle">THE HORSE SHOE STUDIO &bull; IDENTITY v2 APPROVED</text>
</svg>
