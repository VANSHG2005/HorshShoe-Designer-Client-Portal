<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" fill="none">
  <defs>
    <linearGradient id="bgStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0714" />
      <stop offset="50%" stop-color="#140c24" />
      <stop offset="100%" stop-color="#06030a" />
    </linearGradient>
    <linearGradient id="facetA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="facetB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="facetC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="facetD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="starBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="640" fill="url(#bgStar)" />

  <!-- Outer Artboard Bounds -->
  <rect x="40" y="40" width="920" height="560" rx="16" fill="#110a1f" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Spec Header -->
  <g opacity="0.85">
    <text x="70" y="75" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="700" fill="#c084fc" letter-spacing="2">PROJECT: HSS-102 // STARLIGHT MEDIA</text>
    <text x="500" y="75" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#f5d0fe" text-anchor="middle" letter-spacing="1.5">3D KINETIC MONOGRAM &amp; CINEMA 4D MOTION ASSETS (v2)</text>
    <text x="930" y="75" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" fill="#c084fc" text-anchor="end">STATUS: APPROVED FOR AIR</text>
    <line x1="70" y1="90" x2="930" y2="90" stroke="#a855f7" stroke-width="1" stroke-opacity="0.2" />
  </g>

  <!-- Center-Left: Primary 3D Faceted Emblem & Monogram -->
  <g transform="translate(300, 290)">
    <!-- Ambient Glow Disk -->
    <circle cx="0" cy="0" r="140" fill="url(#neonGlow)" opacity="0.12" filter="url(#starBloom)" />

    <!-- Construction Guide Circles -->
    <circle cx="0" cy="0" r="130" stroke="#a855f7" stroke-width="1" stroke-dasharray="4 4" opacity="0.3" />
    <circle cx="0" cy="0" r="85" stroke="#ec4899" stroke-width="1" stroke-dasharray="3 3" opacity="0.3" />

    <!-- 3D Geometric Faceted Star Monogram -->
    <!-- North Facet -->
    <polygon points="0,-110 32,-32 0,0" fill="url(#facetA)" />
    <polygon points="0,-110 -32,-32 0,0" fill="url(#facetB)" />
    <!-- East Facet -->
    <polygon points="110,0 32,32 0,0" fill="url(#facetC)" />
    <polygon points="110,0 32,-32 0,0" fill="url(#facetA)" />
    <!-- South Facet -->
    <polygon points="0,110 -32,32 0,0" fill="url(#facetD)" />
    <polygon points="0,110 32,32 0,0" fill="url(#facetC)" />
    <!-- West Facet -->
    <polygon points="-110,0 -32,-32 0,0" fill="url(#facetB)" />
    <polygon points="-110,0 -32,32 0,0" fill="url(#facetD)" />

    <!-- Central Diamond Core Highlight -->
    <polygon points="0,-18 18,0 0,18 -18,0" fill="#ffffff" opacity="0.9" filter="url(#starBloom)" />

    <!-- Wordmark Below Emblem -->
    <text x="0" y="155" font-family="'Outfit', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="8">STARLIGHT</text>
    <text x="0" y="180" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="4">STREAMING &bull; CINEMA &bull; MOTION</text>
  </g>

  <!-- Right: Brand Guidelines & Technical Specs -->
  <g transform="translate(600, 130)">
    <!-- Swatch 1 -->
    <rect width="320" height="90" rx="12" fill="#170d2b" stroke="#3b1d6e" stroke-width="1" />
    <text x="20" y="28" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Iridescent Prism Palette</text>
    <g transform="translate(20, 42)">
      <rect width="45" height="32" rx="6" fill="#ec4899" />
      <rect x="55" width="45" height="32" rx="6" fill="#a855f7" />
      <rect x="110" width="45" height="32" rx="6" fill="#6366f1" />
      <rect x="165" width="45" height="32" rx="6" fill="#38bdf8" />
      <rect x="220" width="45" height="32" rx="6" fill="#ffffff" />
    </g>

    <!-- Animation & Bumpers Box -->
    <g transform="translate(0, 110)">
      <rect width="320" height="110" rx="12" fill="#170d2b" stroke="#3b1d6e" stroke-width="1" />
      <text x="20" y="28" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Cinema 4D Rendering Spec</text>
      <text x="20" y="48" font-family="Inter, sans-serif" font-size="11" fill="#d8b4fe">Render Engine: Redshift 4K (3840 x 2160)</text>
      <text x="20" y="66" font-family="Inter, sans-serif" font-size="11" fill="#d8b4fe">Frame Rate: 60 fps &bull; Neon dispersion 1.42</text>
      <text x="20" y="90" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" fill="#f472b6">Delivered to: Starlight Post-Production Suite</text>
    </g>

    <!-- Client Approval Card -->
    <g transform="translate(0, 240)">
      <rect width="320" height="110" rx="12" fill="#04271d" stroke="#059669" stroke-width="1.5" />
      <circle cx="34" cy="30" r="14" fill="#059669" />
      <text x="34" y="35" font-family="Inter, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle">&check;</text>
      <text x="58" y="28" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">Approved Deliverable</text>
      <text x="58" y="44" font-family="Inter, sans-serif" font-size="10" fill="#6ee7b7">"The 3D neon refraction mark is outstanding! Full approval granted for trailer and social campaign cards."</text>
      <text x="20" y="85" font-family="'JetBrains Mono', monospace, sans-serif" font-size="9" font-weight="700" fill="#34d399">&bull; TAYLOR MORGAN &bull; CREATIVE DIRECTOR, STARLIGHT</text>
    </g>
  </g>

  <!-- Studio Footer -->
  <text x="500" y="618" font-family="'JetBrains Mono', monospace, sans-serif" font-size="10" font-weight="700" fill="#a855f7" text-anchor="middle" letter-spacing="2">THE HORSE SHOE STUDIO &bull; 3D &amp; MOTION BRANDING DIVISION</text>
</svg>